[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Без этого корень проекта не попадает в sys.path и conftest падает
# с ModuleNotFoundError: No module named 'app' (pytest кладёт в путь
# только каталог tests/, т.к. в нём нет __init__.py).
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
