[project]
name = "wallet-api"
version = "2.0.0"
description = "REST API для работы с балансом кошельков пользователей"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",     # Depends()/Query() в аргументах — идиома FastAPI
    # Комментарии и докстринги в проекте на русском, поэтому проверки
    # на «неоднозначные» юникод-символы дают только ложные срабатывания.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы длинные assert'ы и «магические» константы.
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]
